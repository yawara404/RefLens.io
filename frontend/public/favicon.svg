      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- 背景角丸 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  
